<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Базова сторінка</title>
</head>
<body>
    <h1>Вітаю на моїй сторінці</h1>

    <p>Це перший абзац тексту. Тут можна писати основну інформацію.</p>

    <p>Це другий абзац. Він містить <br> перенос рядка всередині абзацу.</p>

    <p>Третій абзац тексту.<br>Ще один рядок після переносу.</p>

    <p>Четвертий абзац. Можна додавати <br> декілька <br> переносів рядка.</p>
</body>
</html>
